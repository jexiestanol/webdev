<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Sunday Table Notes — a quiet weekend breakfast journal."
    />

    <title>Sunday Table Notes</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container-fluid page-shell">
      <section class="row g-3 bento" aria-label="Sunday Table Notes">
        <!-- Left column -->
        <div class="col-12 col-lg-8 d-flex flex-column left-stack">
          <!-- Hero card -->
          <article class="card-panel hero-card">
            <img
              src="assets/morning-table.jpg"
              alt="A slow breakfast of toast and coffee in the morning light"
            />

            <div class="photo-shade"></div>

            <div class="hero-copy">
              <p class="eyebrow">The weekend edit · No. 04</p>

              <h1>
                A slower<br />
                kind of<br />
                morning.
              </h1>
            </div>

          </article>

          <!-- Lower cards -->
          <div class="row g-3 lower-row">
            <!-- Bread card -->
            <div class="col-12 col-md-6 d-flex">
              <article class="card-panel loaf-card w-100">
                <img
                  src="assets\fresh_loaf.jpg"
                  alt="A fresh artisan loaf ready to be sliced"
                />

                <div class="loaf-shade"></div>

                <p class="loaf-tag">01 / Fresh loaf</p>

              </article>
            </div>

            <!-- Ritual card -->
            <div class="col-12 col-md-6 d-flex">
              <article class="card-panel ritual-card w-100">
                <p class="eyebrow">Today's ritual</p>

                <p class="ritual-copy">
                  Butter the<br />
                  toast.<br />
                  Pour the<br />
                  coffee.<br />
                  Stay<br />
                  awhile.
                </p>

                <div class="ritual-footer">
                  <span>09:32 AM</span>
                  <span>Sunday</span>
                </div>
              </article>
            </div>
          </div>
        </div>

        <!-- Right column -->
        <div class="col-12 col-lg-4 d-flex flex-column right-stack">
          <!-- Yellow title card -->
          <article class="card-panel title-card">
            <p class="eyebrow">Small pleasures, well served</p>

            <h2>
              Sunday<br />
              Table<br />
              Notes
            </h2>
          </article>

          <!-- Table image card -->
          <article class="card-panel table-card">
            <img
              src="assets\table_details.jpg"
              alt="A warm cup of coffee on a softly lit table"
            />

            <div class="table-caption">
              <p class="eyebrow">On the table</p>
              <p>Greens, toast, soft light.</p>
            </div>

          </article>
        </div>
      </section>
    </main>
  </body>
</html>
